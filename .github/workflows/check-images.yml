name: Image Reference Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache URL check results
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/check-images
          key: check-images-${{ runner.os }}-${{ hashFiles('src/**/*.asset.json') }}
          restore-keys: check-images-${{ runner.os }}-
      - name: Run image reference check (incremental on PRs)
        id: check
        run: |
          mkdir -p reports
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SINCE="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}" --depth=50 || true
            node scripts/check-images.mjs --ci --since="$SINCE" \
              --report-json=reports/image-check.json \
              --report-html=reports/image-check.html \
              --pr-comment=reports/pr-comment.md
          else
            node scripts/check-images.mjs --ci \
              --report-json=reports/image-check.json \
              --report-html=reports/image-check.html \
              --pr-comment=reports/pr-comment.md
          fi
      - name: Upload report
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: image-check-report
          path: reports/
      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: image-check
          path: reports/pr-comment.md
